name: CI

on:
  pull_request:
    branches:
      - release/**
      - develop
      - main

  push:
    branches:
      - release/**
      - develop

# push (develop) and pull_request (develop -> main) can fire on the same
# commit within seconds of each other; both jobs sign in the same shared
# Clerk e2e test user, so let one finish before the other starts instead of
# racing them against Clerk's test-instance API.
concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest

    # Clerk test-instance keys (not the production live keys) - required for
    # the app to boot at all (clerkMiddleware throws without a publishable
    # key) and for e2e/global.setup.ts to sign in a dedicated test user.
    # DATABASE_URL - required since release 6.1.0-alpha's cloud sync; without
    # it src/db/client.ts throws on every request that touches persistence,
    # which is most of the app. The repo secret existing on its own does
    # nothing - it has to be explicitly mapped into the job's env like every
    # other secret here.
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
      E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run linter
        run: npm run lint

      - name: Run unit/component tests with coverage
        run: npm run test:coverage

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Build application
        run: npx next build
