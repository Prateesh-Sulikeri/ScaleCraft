language: "en-US"

reviews:
  profile: "chill"

  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0

    base_branches:
      - "develop"
      - "release/.*"

chat:
  auto_reply: true
